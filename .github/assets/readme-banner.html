<!doctype html>
<!-- Source for readme-banner.png. Render at 1280x720 with deviceScaleFactor 2 (2560x1440).
     One idea: one call, six providers. Landing palette and type, nothing decorative. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#121110}
  .frame{position:relative;width:1280px;height:720px;padding:84px 96px;background:#121110;color:#e9e6df;font-family:"DM Sans",sans-serif;display:flex;flex-direction:column}
  .mark{display:flex;align-items:center;gap:12px;font-weight:600;font-size:24px;letter-spacing:-.02em}
  .mark svg{width:28px;height:28px}
  h1{margin:auto 0 0;font-weight:500;font-size:84px;line-height:1;letter-spacing:-.045em;max-width:980px}
  h1 code{font:500 76px "JetBrains Mono",monospace;letter-spacing:-.05em}
  .call{margin:30px 0 0;font:400 22px "JetBrains Mono",monospace;color:#8f8c84}
  .call b{font-weight:400;color:#d39e8a}.call i{font-style:normal;color:#cdbb8c}
  .foot{margin-top:64px;padding-top:28px;border-top:1px solid #262420;display:flex;align-items:center;justify-content:space-between}
  .logos{display:flex;align-items:center;gap:34px}
  .logos img{height:28px;width:auto;max-width:44px}
  .npm{font:500 18px "JetBrains Mono",monospace;color:#8f8c84}
  .npm span{color:#e9e6df}
</style></head><body>
<div class="frame">
  <div class="mark">
    <svg viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M6 3h12a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-6.2l-4.6 3.7A.75.75 0 0 1 6 20.1V17a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Zm3.2 4.2a.9.9 0 0 0-1.3 1.3L9.9 10.5l-2 2a.9.9 0 1 0 1.3 1.3l2.6-2.7a.9.9 0 0 0 0-1.2Zm3.3 5.1a.9.9 0 1 0 0 1.8h3.6a.9.9 0 1 0 0-1.8Z"/></svg>
    SMS SDK
  </div>
  <h1>One <code>send()</code> for<br>every SMS provider.</h1>
  <p class="call"><b>await</b> sms.send({ to, body: <i>"Your order has shipped."</i> })</p>
  <div class="foot">
    <div class="logos">
      <img src="../../apps/docs/public/providers/color/twilio.svg" alt=""><img src="../../apps/docs/public/providers/color/telnyx.svg" alt=""><img src="../../apps/docs/public/providers/color/plivo-dark.svg" alt=""><img src="../../apps/docs/public/providers/color/vonage-dark.svg" alt=""><img src="../../apps/docs/public/providers/color/bandwidth.svg" alt=""><img src="../../apps/docs/public/providers/color/sinch-dark.svg" alt="">
    </div>
    <div class="npm">npm i <span>@opencoredev/sms-sdk</span></div>
  </div>
</div>
</body></html>
